name: Agent loop launcher checks
on:
  push:
    branches: [edition/lite]
    paths:
      - 'tools/agent-loop.mjs'
      - 'tools/agent-loop.test.mjs'
      - 'tools/agent-loop/**'
      - 'tools/python-runtime.mjs'
      - 'tools/lite-local.test.mjs'
      - 'tools/lite-local.mjs'
      - 'tools/godot-log*'
      - 'tools/godot_log.py'
      - 'tools/test_lite_network.py'
      - '.github/workflows/agent-loop-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact source and test without any model calls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git -c credential.helper='!gh auth git-credential' clone --no-checkout "https://github.com/$env:GITHUB_REPOSITORY.git" source
          if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }
          git -C source checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
          $log=Join-Path $env:RUNNER_TEMP 'agent-loop-tests.txt'
          node --test ./source/tools/agent-loop.test.mjs ./source/tools/lite-local.test.mjs 2>&1 | Tee-Object -FilePath $log
          $result=$LASTEXITCODE
          $text=Get-Content -Raw -LiteralPath $log
          $escaped=$text.Substring([Math]::Max(0,$text.Length-3500)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
          if ($result -ne 0) { Write-Host "::error title=Agent loop tests::$escaped";throw 'Agent loop tests failed' }
          Write-Host "::notice title=Agent loop tests::$escaped"
      - name: Exercise the real pinned Codex sandbox without model calls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path $env:RUNNER_TEMP 'codex-sandbox-qa'
          npm.cmd install --prefix $package --ignore-scripts @openai/codex@0.163.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Codex installation failed' }
          $env:HEARTHTABLE_REAL_CODEX=Join-Path $package 'node_modules\@openai\codex\bin\codex.js'
          $log=Join-Path $env:RUNNER_TEMP 'real-codex-sandbox.txt'
          # Provision only this fresh hosted VM; never change the owner's
          # security settings or enable an agent schedule from CI.
          node $env:HEARTHTABLE_REAL_CODEX sandbox setup --elevated --current-user 2>&1 | Tee-Object -FilePath $log
          $result=$LASTEXITCODE
          if ($result -eq 0) {
            node ./source/tools/lite-local.mjs setup 2>&1 | Tee-Object -FilePath $log -Append
            $result=$LASTEXITCODE
          }
          if ($result -eq 0) {
            node --test --test-name-pattern='real Windows Codex sandbox' ./source/tools/agent-loop.test.mjs 2>&1 | Tee-Object -FilePath $log -Append
            $result=$LASTEXITCODE
          }
          $text=Get-Content -Raw -LiteralPath $log
          $escaped=$text.Substring([Math]::Max(0,$text.Length-3500)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
          if ($result -ne 0) { Write-Host "::error title=Real Codex sandbox::$escaped";throw 'Real Windows sandbox check failed' }
          Write-Host "::notice title=Real Codex sandbox::$escaped"

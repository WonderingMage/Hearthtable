name: Portable release

on:
  push:
    tags: ['v*', 'lite-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      windows_probe:
        description: Only test the published Windows EXE (does not publish)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: portable-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: inputs.windows_probe != true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the exact requested tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(lite-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git -c credential.helper='!gh auth git-credential' clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" source
          git -C source checkout --detach "refs/tags/$RELEASE_TAG"
          test -z "$(git -C source status --porcelain)"
      - name: Build, test, and publish the portable prerelease
        shell: bash
        run: |
          set -euo pipefail
          cd source
          if [[ "$RELEASE_TAG" == lite-v* ]]; then
            RELEASE_BUILDER=tools/release_lite.py
          else
            RELEASE_BUILDER=tools/release.py
          fi
          RELEASE_LOG="$RUNNER_TEMP/portable-release.log"
          if python3 "$RELEASE_BUILDER" --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/portable-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --publish --repo "$GITHUB_REPOSITORY" 2>&1 | tee "$RELEASE_LOG"; then
            exit 0
          fi
          python3 - "$RELEASE_LOG" <<'PYLOG'
          from pathlib import Path
          import sys
          text=Path(sys.argv[1]).read_text()[-12000:]
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::error title=Portable release diagnostic::'+text)
          PYLOG
          exit 1
  windows-probe:
    if: inputs.windows_probe == true
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Run the actual published Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -c credential.helper='!gh auth git-credential' clone --no-checkout "https://github.com/$env:GITHUB_REPOSITORY.git" source
          if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }
          git -C source checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
          & ./source/tools/windows_probe.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY
